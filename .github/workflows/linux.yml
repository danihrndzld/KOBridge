name: Linux build

# Builds the .deb and .AppImage for a published release and attaches them to it.
# Actions are pinned to commit SHAs; only the upload job can write to the repo.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Linux bundles to (empty builds main without uploading)
        required: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev zlib1g-dev pkg-config
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: aria2c sidecar (static, OpenSSL)
        run: ./scripts/build-aria2.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: bunx tauri build --bundles deb,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb*
            src-tauri/target/release/bundle/appimage/*.AppImage*

  release:
    needs: build
    if: github.event.release.tag_name != '' || inputs.tag != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-bundles
          path: bundles
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" bundles/deb/*.deb bundles/appimage/*.AppImage --clobber --repo "$GITHUB_REPOSITORY"
          # Add the Linux entries to the latest.json the macOS release uploaded, so the updater finds them
          gh release download "$TAG" -p latest.json --repo "$GITHUB_REPOSITORY"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for f in bundles/appimage/*.AppImage bundles/deb/*.deb; do
            [ -f "$f.sig" ] || continue
            case "$f" in *.AppImage) key=linux-x86_64-appimage ;; *) key=linux-x86_64-deb ;; esac
            jq --arg k "$key" --arg u "$url/$(basename "$f")" --rawfile s "$f.sig" '.platforms[$k] = {url: $u, signature: $s}' latest.json > l.json
            mv l.json latest.json
          done
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
