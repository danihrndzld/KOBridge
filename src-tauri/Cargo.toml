[package]
name = "kobridge"
version = "0.6.1"
description = "KOReader on a Kindle, managed over SSH"
authors = ["Daniel Hernández"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "kobridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "io-util", "fs", "sync", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
